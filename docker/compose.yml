# ClearRoute Mini PC Stack
# Services: Dify AI Platform · Ollama (Qwen) · n8n Automation
# Target: Windows 11 + WSL2 | Laptop access via LAN

name: clearroute-minipc

services:

  # ── Nginx ── single entry point on :80 for Dify ──────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dify-web
      - dify-api
    networks:
      - minipc-net

  # ── Dify Web ──────────────────────────────────────────────────
  dify-web:
    image: langgenius/dify-web:latest
    restart: unless-stopped
    environment:
      EDITION: SELF_HOSTED
      CONSOLE_API_URL: ""
      APP_API_URL: ""
    networks:
      - minipc-net

  # ── Dify API ──────────────────────────────────────────────────
  dify-api:
    image: langgenius/dify-api:latest
    restart: unless-stopped
    environment:
      MODE: api
      LOG_LEVEL: INFO
      SECRET_KEY: ${DIFY_SECRET_KEY}
      INIT_PASSWORD: ${DIFY_INIT_PASSWORD}
      CONSOLE_WEB_URL: ""
      CONSOLE_API_URL: ""
      SERVICE_API_URL: ""
      APP_WEB_URL: ""
      FILES_URL: ""
      MIGRATION_ENABLED: "true"
      # Database
      DB_USERNAME: ${POSTGRES_USER:-dify}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-dify}
      # Redis
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_USE_SSL: "false"
      REDIS_DB: 0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@dify-redis:6379/1
      # Storage (local volume; swap to s3/minio for multi-device sharing)
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      # Vector store
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: ""
      # Code sandbox
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY}
      CODE_MAX_NUMBER: 100
      CODE_MAX_STRING_LENGTH: 80000
      CODE_MAX_OBJECT_ARRAY_LENGTH: 30
      CODE_MAX_STRING_ARRAY_LENGTH: 30
      CODE_MAX_NUMBER_ARRAY_LENGTH: 1000
      # CORS — allow laptop to call the API directly
      WEB_API_CORS_ALLOW_ORIGINS: "*"
      CONSOLE_CORS_ALLOW_ORIGINS: "*"
      MAIL_TYPE: ""
      # Plugin daemon (required for model providers in v1.x)
      PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY}
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DAEMON_INNER_API_KEY}
    volumes:
      - dify-storage:/app/api/storage
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      weaviate:
        condition: service_started
    networks:
      - minipc-net

  # ── Dify Worker (Celery) ──────────────────────────────────────
  dify-worker:
    image: langgenius/dify-api:latest
    restart: unless-stopped
    environment:
      MODE: worker
      LOG_LEVEL: INFO
      SECRET_KEY: ${DIFY_SECRET_KEY}
      DB_USERNAME: ${POSTGRES_USER:-dify}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-dify}
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_USE_SSL: "false"
      REDIS_DB: 0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@dify-redis:6379/1
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: ""
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY}
      MAIL_TYPE: ""
      PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY}
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DAEMON_INNER_API_KEY}
    volumes:
      - dify-storage:/app/api/storage
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    networks:
      - minipc-net

  # ── Postgres (Dify backend DB) ────────────────────────────────
  dify-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dify}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dify-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-dify} -d ${POSTGRES_DB:-dify}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - minipc-net

  # ── Redis ─────────────────────────────────────────────────────
  dify-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - dify-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - minipc-net

  # ── Weaviate (vector store for Dify knowledge bases) ──────────
  weaviate:
    image: semitechnologies/weaviate:1.24.1
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      ASYNC_INDEXING: "true"
    volumes:
      - weaviate-data:/var/lib/weaviate
    networks:
      - minipc-net

  # ── Dify Sandbox (code execution) ────────────────────────────
  dify-sandbox:
    image: langgenius/dify-sandbox:latest
    restart: unless-stopped
    environment:
      API_KEY: ${SANDBOX_API_KEY}
      GIN_MODE: release
      WORKER_TIMEOUT: 15
      ENABLE_NETWORK: "true"
      HTTP_PROXY: http://ssrf-proxy:3128
      HTTPS_PROXY: http://ssrf-proxy:3128
    networks:
      - minipc-net

  ssrf-proxy:
    image: ubuntu/squid:latest
    restart: unless-stopped
    networks:
      - minipc-net

  # ── Dify Plugin Daemon (required for model providers in v1.x) ─
  dify-plugin-daemon:
    image: langgenius/dify-plugin-daemon:0.6.1-local
    restart: unless-stopped
    environment:
      DB_USERNAME: ${POSTGRES_USER:-dify}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      SERVER_PORT: 5002
      SERVER_KEY: ${PLUGIN_DAEMON_KEY}
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: ${PLUGIN_DAEMON_INNER_API_KEY}
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_USE_SSL: "false"
      REDIS_DB: 0
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
      MAX_PLUGIN_PACKAGE_SIZE: 52428800
      PPROF_ENABLED: "false"
      FORCE_VERIFYING_SIGNATURE: "false"
      PYTHON_ENV_INIT_TIMEOUT: 120
      PLUGIN_MAX_EXECUTION_TIMEOUT: 600
      PLUGIN_STDIO_BUFFER_SIZE: 1024
      PLUGIN_STDIO_MAX_BUFFER_SIZE: 5242880
      PIP_MIRROR_URL: ""
      SENTRY_ENABLED: "false"
    volumes:
      - dify-storage:/app/storage
    depends_on:
      dify-db:
        condition: service_healthy
    networks:
      - minipc-net

  # ── Ollama (local LLM inference — Qwen & more) ───────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"   # Dify and n8n connect to this directly
    environment:
      # Keep loaded models resident in memory for 24 hours of inactivity.
      # Without this, Ollama evicts qwen3:14b after ~5 min and the next
      # request cold-starts (3-5 min load time), exceeding Dify's 300s timeout.
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ollama-data:/root/.ollama
    # ── NVIDIA GPU passthrough (WSL2) ──
    # Uncomment if your mini PC has an NVIDIA GPU and you have
    # nvidia-container-toolkit installed. WSL2 auto-exposes GPU.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - minipc-net

  # ── n8n (workflow automation) ─────────────────────────────────
  # Exposed directly on :5678 — no nginx path-prefix needed.
  # Webhook URL uses the mini PC's LAN IP so laptop triggers work.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      # Set MINIPC_IP in your .env to the mini PC's LAN address
      WEBHOOK_URL: "http://${MINIPC_IP:-localhost}:5678/"
      GENERIC_TIMEZONE: ${TIMEZONE:-Europe/London}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      # Point n8n AI nodes at Ollama (OpenAI-compatible endpoint)
      N8N_AI_ENABLED: "true"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - minipc-net

volumes:
  dify-db-data:
  dify-redis-data:
  dify-storage:
  weaviate-data:
  ollama-data:
  n8n-data:

networks:
  minipc-net:
    driver: bridge
