events {
    worker_connections 1024;
}

http {
    client_max_body_size 100M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Use Docker's internal DNS resolver — resolves container names dynamically
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name _;

        # -- Dify console API --
        location /console/api {
            set $dify_api http://dify-api:5001;
            proxy_pass $dify_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -- Dify service API --
        location /api {
            set $dify_api http://dify-api:5001;
            proxy_pass $dify_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -- Dify public API --
        location /v1 {
            set $dify_api http://dify-api:5001;
            proxy_pass $dify_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -- Dify file uploads/downloads --
        location /files {
            set $dify_api http://dify-api:5001;
            proxy_pass $dify_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 100M;
        }

        # -- Dify setup endpoint --
        location /console/api/setup {
            set $dify_api http://dify-api:5001;
            proxy_pass $dify_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -- Dify web frontend (catch-all) --
        location / {
            set $dify_web http://dify-web:3000;
            proxy_pass $dify_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
